services:
  # 1. FastAPI Backend Service
  - type: web
    name: cloud-mandi-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cloud-mandi-db
          property: connectionString
      - key: DATA_GOV_API_KEY
        value: 579b464db66ec23bdd000001cdd3946e44ce4aad7209ff7b23ac571b
      - key: DATA_GOV_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: adminpassword
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: SYNC_INTERVAL_HOURS
        value: "6"
      - key: CORS_ORIGINS
        value: '["*"]'

  # 2. React + Vite Frontend Static Site
  - type: web
    name: cloud-mandi-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cloud-mandi-backend
          property: host

databases:
  # Managed Cloud PostgreSQL Database
  - name: cloud-mandi-db
    databaseName: mandi_price_cloud
    user: mandi_user
    plan: free
